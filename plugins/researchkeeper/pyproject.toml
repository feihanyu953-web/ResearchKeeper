[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsk"
version = "0.2.0"
description = "ResearchKeeper — AI-assisted paper knowledge management for academic researchers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24",
    "sentence-transformers>=2.6",
    "huggingface-hub>=0.20",
    "torch>=2.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "modelscope>=1.10",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
rsk = "rsk.cli:main"

[tool.setuptools.packages.find]
include = ["rsk*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
rsk = ["audit/*.md"]

[tool.setuptools.data-files]
"schemas" = ["schemas/schema-proposal.schema.json"]
"schemas/generic-science" = [
